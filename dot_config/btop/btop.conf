#? Config file for btop

# ── Appearance ─────────────────────────────────────────────────────────────────
color_theme = "Default"
theme_background = True
truecolor = True
rounded_corners = True
graph_symbol = "braille"

# ── Layout ────────────────────────────────────────────────────────────────────
shown_boxes = "cpu mem net proc"
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"

# ── Processes ─────────────────────────────────────────────────────────────────
vim_keys = True
proc_sorting = "memory"
proc_tree = False
proc_colors = True
proc_gradient = True
proc_mem_bytes = True
proc_cpu_graphs = True

# ── CPU ───────────────────────────────────────────────────────────────────────
check_temp = True
show_coretemp = True
show_cpu_freq = True
temp_scale = "celsius"

# ── Memory ───────────────────────────────────────────────────────────────────
show_swap = True
swap_disk = True
show_disks = True
only_physical = True
use_fstab = True

# ── Network ──────────────────────────────────────────────────────────────────
net_auto = True
net_sync = True

# ── Misc ─────────────────────────────────────────────────────────────────────
update_ms = 2000
show_battery = True
log_level = "WARNING"
